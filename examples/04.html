<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5주차 예제 4 · radio는 name이 같아야 한 묶음이 됩니다</title>
</head>
<body>
  <!--
  5주차 예제 4 — radio는 name이 같아야 한 묶음이 됩니다
  -->
  <fieldset>
    <legend>학년</legend>

    <label><input type="radio" name="grade" value="1"> 1학년</label>
    <label><input type="radio" name="grade" value="2"> 2학년</label>
    <label><input type="radio" name="grade" value="3"> 3학년</label>
  </fieldset>

  <!-- name이 다르면 각자 따로 놀아서 여러 개가 선택됩니다 — 가장 흔한 실수입니다. -->
</body>
</html>
