<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5주차 예제 5 · textarea와 select</title>
</head>
<body>
  <!--
  5주차 예제 5 — textarea와 select
  -->
  <label for="msg">문의 내용</label>
  <textarea id="msg" rows="5" placeholder="자유롭게 적어 주세요"></textarea>
  <!-- ⚠ textarea는 값을 속성이 아니라 태그 사이에 넣습니다. 빈 요소가 아닙니다. -->

  <label for="major">전공</label>
  <select id="major">
    <option value="">선택하세요</option>
    <option value="ai">AI·SW계열</option>
    <option value="ai">AI소프트웨어학부</option>
  </select>
</body>
</html>
